vision_algorithm:
  line_features:
    max_centers: 8
    guide_min_points: 3
    image_center_u: 410.0
    curve_min_points: 5
    curve_min_v_span_px: 80.0
    curve_local_fit_points: 4
    guide_fit_rmse_full_scale_px: 20.0

  line:
    line_stable_window: 10
    line_stable_min_hits: 7

  line_p2p:
    offset_gain: 0.3
    heading_gain: 0.3
    steering_deadband: 0.10
    ready_lead_sec: 0.25  # Match forward_walk; estimate the 40% sampling point
    failure_observation_sec: 2.0
    recovery_observation_sec: 1.0
    failure_min_valid_samples: 5
    no_evidence_max_retries: 5
    recovery_max_turns: 5
    recovery_turn_yaw_deg: 15

  # Pixel thresholds refer to the actual input image (defaults: 640x480).
  ball:
    
    down_search_timeout_sec: 10.0
    recovery_observation_sec: 1.0
    recovery_max_observations: 5
    recovery_walk_turn_max: 5 # forward BALL loss: max WALK-pose 27/28 turns, then stationary recovery
    post_pickup_back_steps: 0   # 0: no backing away after pickup; return camera and reacquire line
    stable_window: 10
    stable_min_hits: 7
    lost_frames: 5
    smooth_alpha: 0.45

    upper_acquire_v_px: 470.0 # 공이 있을 조건

    # forward
    far_u_des_px: 380.0 # 세로선 중심
    approach_u_deadband_px: 160 # 세로선 반폭    
    
    approach_short_v_px: 288.0 # 위 가로선 (4걸음)
    approach_two_step_v_px: 320.0 # 아래 가로선 (3걸음 / 2걸음 후 down)

    # down
    down_one_step_v_px: 10.0 # 위 가로선 (2걸음)
    fine_mode_v_px: 80 # 아래 가로선 (1걸음 / 미세보행)  < pickup_v1_px

    pickup_u1_px: 310
    pickup_u2_px: 385 # ㅇㅋ
    pickup_v1_px: 80
    pickup_v2_px: 130 # ㅇㅋ

    pickup_max_attempts: 100
    ball_ignore_duration_sec: 5.0

    fine_settle_duration_sec: 0.60
    recovery_timeout_sec: 5.0
    recovery_reacquire_min_hits: 3
    recovery_center_tolerance_px: 76.8
    recovery_settle_duration_sec: 0.60

  hurdle:
    down_search_max_steps: 10 # DOWN-view failed detection: up to ten completed one-step walks
    recovery_observation_sec: 1.0
    recovery_max_observations: 5
    stable_window: 10
    stable_min_hits: 7
    lost_frames: 5
    smooth_alpha: 0.45

    upper_acquire_v_px: 470.0 # 허들이 있을 조건

    # forward
    approach_two_step_v_px: 360.0 # 아래 가로선
    approach_short_v_px: 312.0    # 위 가로선

    # 가로 정렬 (현재는 미사용)
    target_u_px: 380 # 세로선 중심
    u_deadband_px: 160 # 세로선 반폭

    # DOWN 카메라 세로 3구역
    down_one_step_v_px: 120.0 # 위 가로선 (2걸음)
    fine_mode_v_px: 210     # 아래 가로선 (1걸음)

    # 허들 접촉 및 넘기
    contact_v_px: 260 # 접촉 선 (반걸음)
    contact_steps: 5     # 접촉 보행 반 걸음 횟수

    hurdle_ignore_duration_sec: 5.0
    recovery_reacquire_min_hits: 3
    recovery_timeout_sec: 5.0
    recovery_center_tolerance_px: 76.8
    recovery_settle_duration_sec: 0.60

  goal:
    recovery_observation_sec: 1.0
    recovery_max_observations: 5
    stable_window: 10
    stable_min_hits: 7
    lost_frames: 5
    smooth_alpha: 0.45

    # 공을 주운 후 GOAL 미션 진입
    post_pickup_walk_fallback_actions: 3 # 라인 복귀 후 13번(5걸음) DONE 우선; 없으면 보행 3회 DONE 후 GOAL 카메라

    # forward
    target_u_px: 380.0          # 중앙 세로 구역의 중심
    approach_u_deadband_px: 160 # 중앙 세로 구역의 반폭

    # 거리 기반 접근 (단위 m)
    approach_short_z_m: 1.20     # 4걸음 → 3걸음 경계
    fine_adjust_start_z_m: 0.80  # GOAL 카메라에서 근거리 접근 진입 기준

    camera_goal_start_z_m: 0.80  # FORWARD 접근에서 GOAL 카메라 전환 기준 (골 튜닝 노드만)

    # 근거리 접근 (GOAL 카메라)
    fine_two_step_range_error_m: 0.30 # 2걸음 → 1걸음 경계
    fine_one_step_range_error_m: 0.15 # 1걸음 → 미세조정 경계

    # 골대 위치 및 투척
    hoop_radius_m: 0.10         # 림 위치 보정에 사용하는 반지름
    throw_landing_x_m: -0.08   # 카메라 기준 허리 0도 공 낙하 X (m)
    throw_landing_z_m: 0.48    # 카메라 기준 허리 0도 공 낙하 전방 Z (m)
    position_tolerance_m: 0.08  # 목표 거리의 허용 오차
    shoot_yaw_limit_deg: 30.0   # 투척 허용 각도 (±30도)

    # 투척 후
    post_shoot_back_steps: 0    # 0: 투척 후 후진 없이 카메라 FORWARD 및 라인 복귀

    # 모션 후 관측 대기
    fine_settle_duration_sec: 0.60

    # 골대 인식 실패 시 복구
    recovery_timeout_sec: 5.0
    recovery_reacquire_min_hits: 3
    recovery_center_tolerance_px: 76.8
    recovery_settle_duration_sec: 0.60

  line_detection:
    class_id: 0
    confidence: 0.60
    min_box_width: 1.0
    min_box_height: 1.0

  object_targets:
    ball_class_id: 1
    goal_class_id: 2
    backboard_class_id: 3
    hurdle_class_id: 4
    ball_confidence: 0.60
    goal_confidence: 0.60
    backboard_confidence: 0.60
    hurdle_confidence: 0.60
    min_box_width: 2.0
    min_box_height: 2.0

  object_association:
    missing_frame_limit: 5
    max_center_distance_norm: 0.25
    max_size_log_ratio: 0.80
    center_distance_weight: 1.0
    size_change_weight: 0.25

  command:
    first_action_id: 1
    action_ack_timeout_sec: 10.0

  mission:
    test_mission: 0
    test_stage: 0
    backboard_depth_strip_width_px: 5
    goal_trial_start_forward: false
    test_ball_mission_index: 1
    test_goal_mission_index: 1
    mission_recovery_max_turns: 10
    mission_recovery_yaw_deg: 15
    camera_motion_timeout_sec: 3.0
    post_motion_observation_sec: 1.0
    # Current-action eligibility: AUTO 40%-READY observation AND queue.
    # 22=straight 3 steps, 23=straight 4 steps. Successor ID is unrestricted.
    # MANUAL retains READY Preview/Commit (no automatic reservation).
    # Use [] for normal post-DONE observation of all object walks.
    # LINE 11/12/13 remains permanently eligible. Node restart required.
    object_ready_mean_actions: [22, 23]
    backboard_min_depth_m: 0.20
    backboard_max_depth_m: 2.50
    enable_ball: true
    enable_hurdle: true
    enable_goal: true
    initial_has_ball: false
