# 객체별 알고리즘 설정. 값 변경 후 실제 로드되는 설치본에 반영하고 노드를 재시작한다.
# line → ball → hurdle → goal → common 순서. 객체 control은 진입 → 접근 → 실행 → 복구 순서.
# 픽셀 기준값은 실제 입력 영상 해상도(기본 640x480)에 적용된다.
vision_algorithm:
  # LINE: 검출 → 특징 계산 → 안정성 → 보행·복구
  line:
    detection:
      class_id: 0 # 검출 모델의 클래스 번호
      confidence: 0.60 # LINE 기준값; 실전 노드 YOLO 전체 1차 신뢰도 기본값으로도 사용
      min_box_width: 1.0 # 사용할 바운딩 박스 최소 가로 크기 (px)
      min_box_height: 1.0 # 사용할 바운딩 박스 최소 세로 크기 (px)

    features:
      # 라인 중심점과 기준선
      max_centers: 8
      guide_min_points: 3 # 필요한 최소 개수
      image_center_u: 380.0 # 라인 중앙 기준선
      ball_view_image_center_u: 380.0 # BALL_VIEW LINE only

      # 직선 피팅과 이상점 제거
      ransac_enabled: true
      ransac_min_input_points: 4
      ransac_residual_threshold_px: 20.0
      ransac_min_sample_v_gap_px: 20.0
      ransac_max_outliers: 2
      guide_fit_rmse_full_scale_px: 20.0 # 안내선 오차 표시의 기준 크기 (px)

      # 곡률 표시용 특징
      curve_min_points: 5 # 곡률 계산 최소 개수
      curve_min_v_span_px: 80.0 # 곡률 계산에 세로 분포 폭
      curve_local_fit_points: 4 # 곡률 표시용 부분 직선 계산의 점 개수

    # LINE loss recovery is separate from normal four-point RANSAC + 10/5.
    recovery:
      observation_sec: 1.0
      min_points: 3
      ransac_enabled: false
      offset_gain: 0.3
      heading_gain: 0.3
      forward_max_turns: 2
      body_max_turns: 5
      scan_max_yaw_deg: 45
      scan_move_sec: 0.5
      scan_hold_sec: 0.5
      scan_return_sec: 0.5
      scan_center_half_width_px: 100.0
      scan_observation_timeout_sec: 2.0
      scan_pause_window: 4
      scan_pause_hits: 2
      scan_verify_window: 10
      scan_verify_hits: 5
      scan_body_turn_deg: 15.0
      scan_max_pairs: 3 # LEFT → RIGHT → CENTER 정지 탐색 최대 3묶음, 미발견 시 FINAL HOLD

    # Separate from the unchanged normal LINE RANSAC and O/H steering.
    curve_search:
      enabled: true
      threshold_deg: 20.0
      min_upper_points: 2
      stable_window: 10
      stable_min_hits: 5
      confirm_extra_sequences: 1
      scan_delay_walk_sequences: 0 # 확정 후 추가 LINE 보행 묶음 없음; CONFIRM 마지막 READY 선예약 보류
      max_scan_yaw_deg: 45
      scan_move_sec: 0.5
      scan_hold_sec: 0.5
      scan_return_sec: 0.5
      center_half_width_px: 50.0
      pause_window: 4
      pause_hits: 2
      verify_window: 10
      verify_hits: 5
      head_search_max_attempts: 3
      body_search_max_attempts: 3
      failure_lock_line_blocks: 20
      post_goal_rearm_line_blocks: 3

    stability:
      line_stable_window: 10
      line_stable_min_hits: 5

    walk:
      # 한 LINE 묶음의 32/33/34번 액션 반복 횟수 (좌회전 / 직진 / 우회전)
      left_repetitions: 1
      straight_repetitions: 1
      right_repetitions: 1
      right_unit_action: 36 # 34 기존: 직진→우회전, 36 신규: 우회전→직진; 변경 후 노드 재시작

      # 보행 방향·제자리 회전 판단
      offset_gain: 0.45 # 위치 오차 가중치
      heading_gain: 0.3
      steering_deadband: 0.08 # |라인 점수|가 이 값보다 작으면 직진, 크면 회전
      in_place_turn_score: 0.5 # |라인 점수|가 이 값보다 크면 WALK 제자리 회전 1회 후 재관측

      # 보행 중 프레임 관측
      ready_lead_sec: 0.20 # 비전 관측 계산과 실행기 READY 발행이 함께 읽는 종료 전 여유 시간
      observation_start_ratio: 0.0 # ACK부터 마지막 READY까지 전체 프레임으로 10중 5 판정·유효 가이드 평균

      # Legacy TURN configuration retained for manual/older tests;
      # AUTO staged recovery below has its own independent parameters.
      # 유실 시 정지 관측·방향 탐색
      failure_observation_sec: 2.0 # 라인 복구 대기
      failure_min_valid_samples: 5 # 정상 LINE 판단에 필요한 최소 유효 O/H 표본 수
      recovery_observation_sec: 1.0 # 두 유실 복구 경로의 회전 후 정지 관측 시간
      visible_recovery_max_turns: 5 # 1순위: 현재 점선 2개 이상, 평균 X 쪽으로 회전
      last_score_recovery_max_turns: 5 # 2순위: 마지막 유효 점수 부호; 0/기록 없음은 정지 관측 5회 후 FINAL HOLD
      recovery_max_turns: 5 # 유효한 |점수| > in_place_turn_score일 때 WALK 회전 보정 한도

  # BALL: 검출·Depth 필터 → 후보 추적 → 미션 동작
  ball:
    enabled: true # 공 미션 사용
    detection:
      class_id: 1 # 공 클래스 번호
      confidence: 0.60 # 공 검출 최소 신뢰도 (0~1)
      min_box_width: 20 # ball 최소 가로 (제일 멀 때 40,40 / 가까울 때  80,80)
      min_box_height: 30 # ball 최소 세로
      aspect_ratio_min: 0.5
      aspect_ratio_max: 1.70
      depth_enabled: true
      allow_missing_depth: true # Depth 측정 실패 허용; 유효한 값이 범위 밖이면 제외
      forward_min_depth_m: 0.35
      forward_max_depth_m: 2.70
      down_min_depth_m: 0.25
      down_max_depth_m: 0.5
      ball_view_min_depth_m: 0.25 # 20 degree BALL_VIEW initial test range
      ball_view_max_depth_m: 0.80
    candidate_tracking:
      enabled: true
      max_center_distance_px: 800.0 # Temporary: tolerate full-frame motion jitter (640x480 diagonal=800px)
      max_size_log_ratio: 4.605170185988092 # ln(100): up to 100x bbox width/height scale
      missing_frame_limit: 15
      max_tracks: 16

    control:
      # 단독 시험·LINE에서 공 진입
      test_mission_index: 1 # 단독 시험 순서: 홀수 RIGHT, 짝수 LEFT
      stable_window: 10
      stable_min_hits: 5 # 안정 검출 최소 횟수
      near_v_min_hits: 3 # 근거리 진입: 최근 10프레임 유효 검출 7회, v>=240 3회
      entry_min_hits: 4 # LINE → BALL 진입
      lost_frames: 15 # 유실 복구 진입 기준 프레임 수
      upper_acquire_v_px: 470.0 # 공이 있을 조건 (중심 v가 이 값 이하인 프레임을 진입 횟수로 계산)

      # FORWARD 접근
      far_u_des_px: 400.0 # FORWARD 사선 및 근거리 격자의 공통 중심선
      approach_top_half_width_px: 45.0 # 화면 위쪽(v=0) 반폭
      approach_bottom_half_width_px: 100.0 # 화면 아래쪽(v=height-1) 반폭
      approach_short_v_px: 100.0 # 위 가로선 (4걸음)
      approach_two_step_v_px: 240.0 # 아래 가로선 (3걸음 / 2걸음 후 down)
      approach_direct_down_v_px: 410.0 # 8번 중앙 가로선 (1걸음 후 down)
      approach_near_outer_margin_px: 80.0 # 근거리 격자 바깥 사선 평행이동 간격 (상단·하단 동일)

      # DOWN 1걸음 탐색
      down_search_min_hits: 3 # DOWN 이동 탐색: 최근 8프레임 중 3회 검출
      down_search_max_steps: 10 # DOWN 탐색 최대 전진 동작 횟수
      down_search_inter_action_hold_sec: 0.3 # BALL DOWN 미검출 시 다음 10번 보행 전 대기; 발견 시 생략

      # DOWN 접근·미세조정
      fine_side_two_step_margin_px: 100.0 # 픽업 좌우 경계 밖 초과 거리(px): 이 값 이상이면 옆걸음 2회 연속
      fine_motion:
        max_repetitions: 3 # 같은 방향만 최대 3회. 아래 값은 DOWN 화면의 공 중심 변화량.
        forward_first_max_lateral_error_px: 120.0 # 영역 위쪽이면 전진 우선, 좌우 허용 여유폭(px)
        forward_delta_u_px: -20 # Action 3 1회 후 공의 Δx (오른쪽 +)
        forward_delta_v_px: 42 # Action 3 1회 후 공의 Δy (아래쪽 +)
        backward_delta_u_px: -35 # Action 4
        backward_delta_v_px: -18
        left_delta_u_px: 40 # Action 5
        left_delta_v_px: 15
        right_delta_u_px: -60 # Action 6
        right_delta_v_px: 1 # 방향별 (0,0)은 미측정. 모두 미측정이면 기존 단발/옆걸음 2회 유지.

      # 픽업
      # 실제 픽업 성공 영역. OpenCV 화면 좌표(u:오른쪽+, v:아래쪽+).
      # 점들을 둘레 순서대로 나열하고 새 꼭짓점은 목록에 [u,v]로 추가.
      pickup_polygon_px:
        - [384, 338]
        - [370, 282]
        - [394, 256]
        - [438, 254]
        - [450, 298]
        - [433, 338]
      pickup_max_attempts: 100
      pickup_verify_min_hits: 3 # 픽업 DONE 후 stable_window 중 잔존 공 검출 기준; 이상이면 재픽업
      pickup_shrink_enabled: true # 두 노드 모두 활성화, rqt에서 ON/OFF 조정 가능
      pickup_initial_shrink_percent: 10.0 # 원본 꼭짓점 영역에서 시작부터 가로/세로 10% 축소
      pickup_shrink_percent: 7.0 # 이후 실패 확정마다 기존 7%씩 추가 축소(변경 없음)
      pickup_shrink_max_failures: 2 # 최대 2회 축소, 새 공 미션 시작 시 초기화

      # 픽업 후 복귀
      post_pickup_back_steps: 0 # 0: 픽업 후 후진 없이 카메라를 복귀하고 LINE 재탐색

      # 유실 복구
      recovery_observation_sec: 1.0
      recovery_max_observations: 5
      recovery_center_tolerance_px: 50 # 복구 방향 선택 기준 - 중앙에서 얼마나
      recovery_walk_turn_max: 3 # 중간 좌/우(4·6) 구역의 회전 후 제자리 관측 한도
      recovery_max_steps: 3 # 일반 FORWARD 유실: 좌우 회전 후/중앙 정지 관측 후 1걸음, 전진 한도
      entry_recovery_max_steps: 1 # 진입 직후 첫 관측 실패의 전진 한도; 소진 후 공 없이 LINE 복귀
      down_recovery_max_actions: 3 # DOWN 유실: 마지막 pickup 사각형 기준 방향으로 FINE 1회→관측, 한도 후 실패

  # HURDLE: 검출·Depth 필터 → 후보 추적 → 미션 동작
  hurdle:
    enabled: true # 허들 미션 사용
    detection:
      class_id: 4 # 허들 클래스 번호
      confidence: 0.60 # 허들 검출 최소 신뢰도 (0~1)
      min_box_width: 200 # hurdle 최소 가로
      min_box_height: 10 # hurdle 최소 세로
      aspect_ratio_min: 1.50
      depth_enabled: true
      allow_missing_depth: true # Depth 측정 실패 허용; 유효한 값이 범위 밖이면 제외
      min_depth_m: 0.25
      max_depth_m: 2.00
    candidate_tracking:
      enabled: true
      max_center_distance_px: 800.0 # Temporary: same permissive identity gate as BALL
      max_size_log_ratio: 4.605170185988092 # ln(100): 100x bbox width/height change
      missing_frame_limit: 15
      max_tracks: 16

    control:
      # LINE에서 허들 진입
      stable_window: 10
      stable_min_hits: 7 # 안정 검출 최소 횟수
      near_v_min_hits: 5 # 근거리 진입: 10프레임 유효 검출 7회, v>=240 5회
      lost_frames: 15 # 유실 복구 진입 기준 프레임 수
      upper_acquire_v_px: 470.0 # 허들이 있을 조건

      # FORWARD 접근·수평 기준
      target_u_px: 380 # 세로선 중심
      approach_short_v_px: 100.0 # 위 가로선 (4걸음)
      pre_down_extra_forward_steps: 2 # Legacy: AUTO near now selects one 32/33/36 instead
      approach_two_step_v_px: 240.0 # 아래 가로선 (3걸음 / 2걸음 후 down)

      # DOWN 1걸음 탐색
      down_search_min_hits: 3 # DOWN: 초기 6/3, 이후 이동 중 미검출 탐색 8/3 (v 하한 없음)
      down_search_min_v_px: 80.0 # Legacy, AUTO DOWN에서는 적용하지 않음
      down_search_max_steps: 10 # 미검출 10번 탐색 한도, 최초 33번/거리별 접근은 제외
      down_search_inter_action_hold_sec: 0.3 # HURDLE DOWN 미검출 탐색 10번: 이동 중+DONE 후 0.3초 연속 관측
      down_stationary_observation_sec: 1.0 # 검출 후 33/10번: DONE 후 신규 정지 관측

      # DOWN 접근·미세조정
      down_one_step_v_px: 40.0 # DOWN 검출 v<120: 직진 2걸음 (33번)
      fine_mode_v_px: 220.0 # DOWN 검출 v>=240: 즉시 FINE 자세

      # DOWN 완료부터 LINE O/H 기억; 2번 자세 DONE 후 FINE 정렬에만 사용
      fine_line_reference_u_px: 380.0 # 허들 DOWN 화면의 로봇 기준선
      fine_line_offset_tolerance_px: 120.0 # |O| 허용 범위 (px)
      fine_line_heading_tolerance_deg: 10.0 # |H| 허용 범위 (도)
      fine_line_observation_sec: 1.0 # 최초 정렬 판단 및 회전+횡이동 묶음의 최종 DONE 이후 정지 관측 (초)
      fine_line_stable_window: 10
      fine_line_stable_min_hits: 5
      fine_line_turn_yaw_deg: 15 # 7/8번 회전 1회 요청각 (도)
      fine_line_measured_turn_deg: 0.0 # 방향별 값이 0일 때 쓰는 공통 호환값. 세 값 모두 0이면 단발 관측
      fine_line_measured_left_turn_deg: 11.0 # Action 7: 1회 H 변화량의 크기. 0이면 공통 실측값 사용
      fine_line_measured_right_turn_deg: 8.0 # Action 8: 1회 H 변화량의 크기. 실행 요청각 15도와 별개
      fine_line_measured_side_px: 60 # 1회 실제 옆걸음에 따른 O 변화량(px). 0: 기존 단발 관측 유지
      fine_line_batch_max_repetitions: 3 # 하나의 O/H 관측에서 회전과 횡이동 각각 최대 연속 3회
      fine_line_post_turn_hold_sec: 0.3 # 연속 회전의 마지막 DONE 이후 횡이동 전 대기 (재관측은 마지막에만)
      fine_line_max_turns: 4
      fine_line_max_side_steps: 4
      fine_line_max_stale_corrections: 2 # 같은 마지막 유효 O/H 재사용 한도
      fine_line_max_search_steps: 3 # 유실 시 3번 FINE 전진 한도

      # 허들 접촉·넘기
      contact_v_px: 220 # 접촉 선 (반걸음)
      contact_steps: 3 # 접촉 보행 반 걸음 횟수
      contact_inter_action_hold_sec: 0.3 # 접촉 보행 DONE 후 다음 접촉 보행까지 정지 시간 (초, 0: 추가 대기 없음)
      pre_cross_hold_sec: 0.5 # 마지막 접촉 반걸음의 실제 DONE 이후 허들 넘기(16번) 시작 전 자세 유지 (초)

      # 허들 넘은 뒤 재진입 방지
      hurdle_ignore_duration_sec: 5.0

      # 유실 복구
      recovery_observation_sec: 1.0
      recovery_max_observations: 5
      recovery_center_tolerance_px: 76.8
      recovery_max_steps: 3 # DOWN 유실: 접근은 1걸음, FINE은 미세 전진 후 재관측
      entry_recovery_max_steps: 3 # 진입 직후 첫 관측 실패: 직진 1걸음씩, 소진 후 LINE 복귀

  # GOAL: 검출·Depth 필터 → 후보 추적 → 미션 동작
  goal:
    enabled: true # 골대 미션 사용
    detection:
      class_id: 2 # 골대 클래스 번호
      confidence: 0.60 # 골대 검출 최소 신뢰도 (0~1)
      min_box_width: 20 # goal 최소 가로
      min_box_height: 20 # goal 최소 세로
    backboard:
      detection:
        class_id: 3 # 백보드 클래스 번호
        confidence: 0.60 # 백보드 검출 최소 신뢰도 (0~1)
        min_box_width: 20 # backboard 최소 가로
        min_box_height: 20 # backboard 최소 세로
      candidate_tracking:
        enabled: true
        max_center_distance_px: 800.0 # Temporary: same permissive identity gate as BALL
        max_size_log_ratio: 4.605170185988092 # ln(100): 100x bbox width/height change
        missing_frame_limit: 15
        max_tracks: 16
      depth:
        depth_strip_width_ratio: 0.15 # 원본 박스 너비의 15%, 좌우 각각 적용
        backboard_depth_center_size_px: 21 # 중앙 ROI 정사각형 한 변
        backboard_depth_strip_step_ratio: 0.05 # 실패 시 좌우 함께 5%p 확대
        backboard_depth_strip_max_width_ratio: 0.30 # 좌우 각각 최대 30%
        backboard_depth_inner_margin_ratio: 0.10 # 상하만 각각 10% 제거; 좌우는 유지
        backboard_depth_min_valid_ratio: 0.10 # 각 ROI 최소 유효 Depth 픽셀 비율
        min_depth_m: 0.10 # 백보드 최소 거리
        max_depth_m: 2.50 # 백보드 최대 거리

    control:
      # 단독 시험·검출 안정성
      trial_start_goal: false # true: 골대 단독 시험을 GOAL 카메라에서 시작, false: 기존 라인 출발
      test_mission_index: 1 # 단독 시험 순서: 홀수 RIGHT, 짝수 LEFT
      stable_window: 10
      stable_min_hits: 7 # 안정 검출 최소 횟수
      near_distance_min_hits: 3 # 같은 관측창에서 근거리 Depth/pose가 유효한 백보드 최소 프레임 수
      lost_frames: 15 # 유실 복구 진입 기준 프레임 수
      smooth_alpha: 0.45

      # 공 픽업 후 LINE에서 GOAL로 전환
      post_pickup_straight_blocks_required: 3 # 공 픽업 후 LINE 복귀부터 직진 묶음이 이 횟수만큼 DONE이면 GOAL 카메라; 0은 직진 조건 끔
      post_pickup_walk_fallback_actions: 5 # 직진 조건보다 먼저 전체 LINE 묶음이 이 횟수만큼 DONE이면 GOAL 카메라; 0은 즉시 진입
      entry_line_retry_max_attempts: 2 # 첫 GOAL 관측에 백보드가 전혀 없으면 FORWARD → LINE 1블록 DONE → 재관측. 추가 시도 한도, 0: 기존 복구

      # GOAL AUTO search: no arm extension; yaw is relative to GOAL pose.
      head_scan_enabled: true
      head_scan_max_yaw_deg: 25
      head_scan_center_half_width_px: 100.0
      head_scan_pause_window: 4
      head_scan_pause_hits: 2
      head_scan_verify_window: 10
      head_scan_verify_hits: 5
      head_scan_move_sec: 0.5
      head_scan_hold_sec: 0.5
      head_scan_return_sec: 0.5
      head_scan_observation_timeout_sec: 2.0
      head_scan_body_turn_one_threshold_deg: 10.0
      head_scan_body_turn_two_threshold_deg: 20.0

      # 접근·카메라 전환
      target_u_px: 320.0 # GOAL WALK 접근 기준 중앙
      auto_approach_reference_u_px: 310.0 # 이전 H 경로 디버그용 기준값 (AUTO 조향 미사용)
      auto_approach_center_u_px: 320.0 # GOAL 전용 수직 3구역 중심
      auto_approach_half_width_px: 100.0 # 180~380px 직진, 밖은 좌/우회전전진
      approach_u_deadband_px: 160 # 중앙 세로 구역의 반폭
      edge_margin_px: 50.0 # GOAL 이미지 경계 보호 구간(px)
      edge_stable_window: 10 # 연속된 프레임 관측창; 기간 내 한번 충족하면 래치
      edge_stable_min_hits: 4 # 좌/우 각각 10중4 이상 접촉 시 우선 제자리 2회전
      approach_short_z_m: 0.8 # GOAL 근거리 진입·FINE 자세 전환 기준; FORWARD 뷰에서는 짧은 보행 선택 기준
      camera_goal_start_z_m: 0.8 # FORWARD 접근에서 GOAL 카메라 전환 기준 (골 튜닝 노드만)

      # 투척 위치·방향
      hoop_radius_m: 0.10 # 림 위치 보정에 사용하는 반지름
      throw_landing_x_m: -0.02 # 카메라 기준 허리 0도 공 낙하 X (m)
      throw_landing_z_m: 0.6 # 카메라 기준 허리 0도 공 낙하 전방 Z (m)
      waist_axis_in_camera_x_m: 0.020 # 카메라 기준 허리축 X (+오른쪽); 실측 전 기존 동작 유지
      waist_axis_in_camera_z_m: -0.100 # 카메라 기준 허리축 Z (+전방); 실측 전 기존 동작 유지
      fine_motion:
        max_repetitions: 3
        forward_delta_x_m: 0.0 # action3 후 카메라 관측 GOAL 상대좌표 X 변화
        forward_delta_z_m: 0.0 # action3 후 카메라 관측 GOAL 상대좌표 Z 변화
        backward_delta_x_m: 0.0
        backward_delta_z_m: 0.0
        left_delta_x_m: 0.0
        left_delta_z_m: 0.0
        right_delta_x_m: 0.0
        right_delta_z_m: 0.0
      position_tolerance_m: 0.04 # 목표 거리의 허용 오차
      shoot_yaw_limit_deg: 20.0 # ±이 값: FINE 투척 허리각 및 좌우 미세 이동 판단 기준

      # 투척 후 복귀
      post_shoot_back_steps: 0 # 0: 투척 후 후진 없이 카메라 FORWARD 및 라인 복귀

      # 유실 복구
      recovery_observation_sec: 1.0
      recovery_max_observations: 5
      recovery_center_tolerance_px: 1 # 마지막 안정 위치가 target_u_px ±이 값이면 WALK 1걸음/FINE 미세 1회 전진 후 관측
      recovery_turn_max: 5 # 좌우 탐색 회전 한도. 재발견 뒤 같은 방향 추가 1회전은 별도
      depth_recovery_max_steps: 3 # FINE Depth 좌표 실패: 반걸음→정지 관측 최대 횟수
      far_depth_probe_max_attempts: 3 # 이미 GOAL 접근 DONE한 AUTO만, YOLO 유효/중앙 Depth 무효일 때 위치 보행+관측

  # COMMON: Depth 표본 → 객체 연결 → 명령 → 미션 공통 동작
  common:
    camera:
      ball_view_pitch_tick: 1850 # ID22, yaw always follows DOWN  // 허들 2013 // 공 1850
    depth_roi_size_px: 5 # 공·허들 BBox 중심 Depth 표본의 한 변 길이 (px)
    object_association:
      # 동일 객체로 연결하는 허용 범위
      missing_frame_limit: 15 # 같은 물체의 추적을 유지할 미검출 프레임 수
      max_center_distance_norm: 0.25 # 같은 물체로 연결할 정규화 중심 거리 한계
      max_size_log_ratio: 0.80 # 같은 물체로 연결할 크기 변화 한계

      # 후보 선택 가중치
      center_distance_weight: 1.0 # 추적 후보 선택 시 중심 거리 가중치
      size_change_weight: 0.25 # 추적 후보 선택 시 크기 변화 가중치

    command:
      first_action_id: 1 # 시작 명령 ID (0은 사용하지 않음)
      action_ack_timeout_sec: 10.0 # 실행기 ACK를 기다리는 제한 시간 (초)

    mission:
      race_round2_fast_enabled: true # 2회차 고속화 전용; 과거 테스트 fixture는 false
      # 시작 상태·단독 시험
      initial_has_ball: false # 시작할 때 공을 가지고 있는 것으로 설정
      test_mission: 0 # 0 전체 미션, 2 공, 3 골대, 4 허들
      test_stage: 0 # 0 전체 과정, 1 접근, 2 정렬, 3 실행

      # AUTO 객체 접근: LINE과 공통 32/33/34 보행, 공·골대 가상 경로는 H만 판단
      object_approach:
        lock_blocks: 3 # 같은 ID의 보행 묶음 전체가 실제 DONE된 횟수 (전송/ACK/READY 아님)
        prelock_loss_extra_blocks: 1 # 락 전 유실 시 마지막 접근 방향으로 추가 탐색할 묶음 수 (0 또는 1)
        reference_v_ratio: 0.80 # 실제 LINE 기준 높이를 못 구하는 GOAL 뷰의 기준
        steering_deadband_deg: 15.0 # 공·골대 가상 경로 |H|가 이 각도 이하면 직진
        in_place_turn_deg: 100.0 # |H|가 이 각도 초과 시 WALK 제자리 회전; 가상선 H는 ±90도 미만
        goal_empty_max_retries: 3 # 최초 GOAL 확인 후 FORWARD→LINE 1묶음→GOAL 재확인 한도; 소진 시 FINAL HOLD

      # 후보·라인 유실 복구
      candidate_search_max_turns: 2 # 수동·단독 시험의 후보 재탐색용; 일반 AUTO 객체 접근에는 불필요
      mission_recovery_max_turns: 30 # 미션 전후 라인 복구 최대 회전 횟수
      mission_recovery_turn_yaw_deg: 15 # 공 줍기/슛 후 FINE 제자리 회전 1회 요청각 (도)

      # 카메라 전환·동작 후 안정 대기
      camera_motion_timeout_sec: 30.0 # 카메라 전환 완료를 기다리는 제한 시간 (초)
      transition_settle_sec: 0.0 # DOWN/GOAL 카메라, 발 자세 변경, 허들 넘기 후 안정 대기 (초)
      walk_inter_action_hold_sec: 0.0 # 일반 WALK 모션 사이 마지막 자세 유지 최소 시간 (초)
      #                                 10, 11, 12, 13, 21, 22, 23, 24, 25, 26, 27, 28, 31, 32, 33, 34
      fine_motion_settle_sec: 0.0 # FINE 전진·후진·옆걸음·제자리 회전 후 관측 전 추가 대기 (초)
      #                             3, 4, 5, 6, 7, 8
      post_motion_observation_sec: 1.0 # DONE 후 공통 관측 최소 시간 (초)

      # 객체 접근 READY 관측 + 자동 선예약 예외 목록 (32, 33, 34는 생략).
      # 예: [22, 23]이면 해당 동작은 40%-READY 평균으로 다음 동작 예약 가능.
      # 기본 DONE 후 1초 관측; 즉시 DOWN/고정 시퀀스는 유지.
      # LINE READY와 수동 PREVIEW/COMMIT은 별도 정책. 재시작 후 반영.
      object_ready_mean_actions: [] # 11, 12 ,13 ,21 ,22 ,23 ,24 ,25 (11, 12, 13은 안 쓰임)
