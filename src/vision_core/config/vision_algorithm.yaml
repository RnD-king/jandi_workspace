vision_algorithm:
  line_features:
    max_centers: 8
    guide_min_points: 3 # 필요한 최소 개수
    image_center_u: 380.0 # 라인 중앙 기준선
    guide_fit_rmse_full_scale_px: 20.0 # 안내선 오차 표시의 기준 크기 (px)

    curve_min_points: 5 # 곡률 계산 최소 개수
    curve_min_v_span_px: 80.0 # 곡률 계산에 세로 분포 폭
    curve_local_fit_points: 4 # 곡률 표시용 부분 직선 계산의 점 개수

  line:
    line_stable_window: 10
    line_stable_min_hits: 7

  # 라인 보행 방향 판단과 유실 복구
  line_p2p:
    offset_gain: 0.3 # 게인 3개
    heading_gain: 0.3
    steering_deadband: 0.10

    ready_lead_sec: 0.25  # ~초 전까지

    failure_observation_sec: 2.0 # 라인 복구 대기
    failure_min_valid_samples: 5
    no_evidence_max_retries: 5 # 방향 정보가 없을 때 정지 관측 재시도 횟수

    recovery_observation_sec: 1.0
    recovery_max_turns: 5 # 라인 회전 복구 최대 완료 횟수
    recovery_turn_yaw_deg: 15 # 라인 회전 복구 요청 각도 (도)

  # Pixel thresholds refer to the actual input image (defaults: 640x480).
  ball:
    # 단독 시험 순서
    test_mission_index: 1 # 단독 시험 순서: 홀수 RIGHT, 짝수 LEFT

    down_search_timeout_sec: 10.0
    recovery_observation_sec: 1.0
    recovery_max_observations: 5
    recovery_walk_turn_max: 3 # forward BALL loss: max completed WALK-pose 31/28 turns, then stationary recovery
    post_pickup_back_steps: 0   # 0: no backing away after pickup; return camera and reacquire line
    stable_window: 10
    stable_min_hits: 7
    lost_frames: 5
    smooth_alpha: 0.45

    upper_acquire_v_px: 470.0 # 공이 있을 조건

    # forward
    far_u_des_px: 380.0 # 세로선 중심
    approach_u_deadband_px: 90 # 세로선 반폭

    approach_short_v_px: 100.0 # 위 가로선 (4걸음)
    approach_two_step_v_px: 240.0 # 아래 가로선 (3걸음 / 2걸음 후 down)

    # down
    down_one_step_v_px: 0.0 # 위 가로선 (2걸음)
    fine_mode_v_px: 10 # 아래 가로선 (1걸음 / 미세보행)  < pickup_v1_px

    pickup_u1_px: 310 # 사각형
    pickup_u2_px: 385 # ㅇㅋ
    pickup_v1_px: 80
    pickup_v2_px: 130 # ㅇㅋ

    pickup_max_attempts: 100
    ball_ignore_duration_sec: 5.0

    recovery_timeout_sec: 5.0
    recovery_reacquire_min_hits: 3
    recovery_center_tolerance_px: 76.8

  hurdle:
    down_search_max_steps: 10 # DOWN-view failed detection: up to ten completed one-step walks
    recovery_observation_sec: 1.0
    recovery_max_observations: 5
    stable_window: 10
    stable_min_hits: 7
    lost_frames: 5
    smooth_alpha: 0.45

    upper_acquire_v_px: 470.0 # 허들이 있을 조건

    # forward
    approach_short_v_px: 250.0    # 위 가로선 (4걸음)
    approach_two_step_v_px: 330.0 # 아래 가로선 (3걸음 / 2걸음 후 down)

    # 가로 정렬 (라인 기준임. 이거 의미 없을 듯)
    target_u_px: 380 # 세로선 중심
    u_deadband_px: 160 # 세로선 반폭

    # DOWN 카메라 세로 3구역
    down_one_step_v_px: 100.0 # 위 가로선 (2걸음)
    fine_mode_v_px: 180     # 아래 가로선 (1걸음)

    # 허들 접촉 및 넘기
    contact_v_px: 260 # 접촉 선 (반걸음)
    contact_steps: 3     # 접촉 보행 반 걸음 횟수

    hurdle_ignore_duration_sec: 5.0
    recovery_reacquire_min_hits: 3
    recovery_timeout_sec: 5.0
    recovery_center_tolerance_px: 76.8

  goal:
    # 화면 이탈 방지: 좌우 끝에서 이 픽셀 이내에 박스가 닿으면 연속 2회 회전
    edge_margin_px: 50.0 # rqt: goal_edge_margin_px, 양쪽에 동시에 닿으면 HOLD

    # 백보드 Depth 표본 및 유효 거리 (px, m)
    backboard_depth_strip_width_px: 5 # 백보드 좌·우 Depth 표본 띠의 폭 (px), 중앙은 3x3
    backboard_min_depth_m: 0.10 # 백보드 Depth의 최소 유효 거리 (m)
    backboard_max_depth_m: 2.50 # 백보드 Depth의 최대 유효 거리 (m)

    # 단독 시험 시작 위치와 순서
    trial_start_goal: false # true: 골대 단독 시험을 GOAL 카메라에서 시작, false: 기존 라인 출발
    test_mission_index: 1 # 단독 시험 순서: 홀수 RIGHT, 짝수 LEFT

    recovery_turn_max: 3
    recovery_observation_sec: 1.0
    recovery_max_observations: 5
    stable_window: 10
    stable_min_hits: 7
    lost_frames: 5
    smooth_alpha: 0.45

    # 공을 주운 후 GOAL 미션 진입
    post_pickup_walk_fallback_actions: 3 # 라인 복귀 후 13번(5걸음) DONE 우선; 없으면 보행 3회 DONE 후 GOAL 카메라

    # forward
    target_u_px: 360.0          # 중앙 세로 구역의 중심
    approach_u_deadband_px: 160 # 중앙 세로 구역의 반폭

    # 거리 기반 접근 (단위 m)
    approach_short_z_m: 1.20     # 4걸음 → 3걸음 경계
    fine_adjust_start_z_m: 0.80  # GOAL 카메라에서 근거리 접근 진입 기준

    camera_goal_start_z_m: 0.80  # FORWARD 접근에서 GOAL 카메라 전환 기준 (골 튜닝 노드만)

    # 근거리 접근 (GOAL 카메라)
    fine_two_step_range_error_m: 0.30 # 2걸음 → 1걸음 경계
    fine_one_step_range_error_m: 0.15 # 1걸음 → 미세조정 경계

    # 골대 위치 및 투척
    hoop_radius_m: 0.10         # 림 위치 보정에 사용하는 반지름
    throw_landing_x_m: -0.08   # 카메라 기준 허리 0도 공 낙하 X (m)
    throw_landing_z_m: 0.40    # 카메라 기준 허리 0도 공 낙하 전방 Z (m)
    position_tolerance_m: 0.08  # 목표 거리의 허용 오차
    shoot_yaw_limit_deg: 15.0   # ±이 값: COARSE 회전 및 FINE 투척/좌우 이동 판단 기준

    # 투척 후
    post_shoot_back_steps: 0    # 0: 투척 후 후진 없이 카메라 FORWARD 및 라인 복귀

    # 골대 인식 실패 시 복구
    recovery_timeout_sec: 5.0
    recovery_reacquire_min_hits: 3
    recovery_center_tolerance_px: 76.8

  line_detection:
    class_id: 0 # 검출 모델의 클래스 번호
    confidence: 0.60 # 이 값 이상인 검출을 사용 (0~1)
    min_box_width: 1.0 # 사용할 바운딩 박스 최소 가로 크기 (px)
    min_box_height: 1.0 # 사용할 바운딩 박스 최소 세로 크기 (px)

  object_targets:
    ball_class_id: 1 # 공 클래스 번호
    goal_class_id: 2 # 골대 클래스 번호
    backboard_class_id: 3 # 백보드 클래스 번호
    hurdle_class_id: 4 # 허들 클래스 번호

    ball_confidence: 0.60 # 공 검출 최소 신뢰도 (0~1)
    goal_confidence: 0.60 # 골대 검출 최소 신뢰도 (0~1)
    backboard_confidence: 0.60 # 백보드 검출 최소 신뢰도 (0~1)
    hurdle_confidence: 0.60 # 허들 검출 최소 신뢰도 (0~1)

    min_box_width: 2.0 # 사용할 바운딩 박스 최소 가로 크기 (px)
    min_box_height: 2.0 # 사용할 바운딩 박스 최소 세로 크기 (px)

  object_association:
    missing_frame_limit: 5 # 같은 물체의 추적을 유지할 미검출 프레임 수
    max_center_distance_norm: 0.25 # 같은 물체로 연결할 정규화 중심 거리 한계
    max_size_log_ratio: 0.80 # 같은 물체로 연결할 크기 변화 한계

    center_distance_weight: 1.0 # 추적 후보 선택 시 중심 거리 가중치
    size_change_weight: 0.25 # 추적 후보 선택 시 크기 변화 가중치

  command:
    first_action_id: 1 # 시작 명령 ID (0은 사용하지 않음)
    action_ack_timeout_sec: 10.0 # 실행기 ACK를 기다리는 제한 시간 (초)

  # 여러 미션에 공통으로 적용되는 설정
  mission:
    test_mission: 0 # 0 전체 미션, 2 공, 3 골대, 4 허들
    test_stage: 0 # 0 전체 과정, 1 접근, 2 정렬, 3 실행

    # 미션 전후 라인 복구
    mission_recovery_max_turns: 10 # 미션 전후 라인 복구 최대 회전 횟수
    mission_recovery_yaw_deg: 15 # 미션 전후 라인 복구 요청 각도 (도)

    # 카메라 전환 완료 제한
    camera_motion_timeout_sec: 3.0 # 카메라 전환 완료를 기다리는 제한 시간 (초)

    # 모션 후 관측 대기
    transition_settle_sec: 0.6 # DOWN/GOAL 카메라, 발 자세 변경, 허들 넘기 후 안정 대기 (초)
    walk_inter_action_hold_sec: 0.0 # 일반 WALK 모션 사이 마지막 자세 유지 최소 시간 (초)
    fine_motion_settle_sec: 0.0 # FINE 전진·후진·옆걸음 후 관측 전 추가 대기 (초)
    post_motion_observation_sec: 1.0 # DONE 후 공통 관측 최소 시간 (초, 10/7 검사와 동시 진행)

    # Current-action eligibility: AUTO 40%-READY observation AND queue.
    # 22=straight 3 steps, 23=straight 4 steps. Successor ID is unrestricted.
    # MANUAL retains READY Preview/Commit (no automatic reservation).
    # Use [] for normal post-DONE observation of all object walks.
    # LINE 11/12/13 remains permanently eligible. Node restart required.
    object_ready_mean_actions: [22, 23]

    # 사용할 미션과 시작 상태
    enable_ball: true # 공 미션 사용
    enable_hurdle: true # 허들 미션 사용
    enable_goal: true # 골대 미션 사용
    initial_has_ball: false # 시작할 때 공을 가지고 있는 것으로 설정
