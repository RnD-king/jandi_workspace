# Fixed regression scenarios. Not installed or used by robot nodes.
# Tune config/vision_algorithm.yaml independently; do not regenerate this file.
vision_algorithm:
  line_features:
    max_centers: 8
    guide_min_points: 3
    image_center_u: 410.0
    curve_min_points: 5
    curve_min_v_span_px: 80.0
    curve_local_fit_points: 4
    guide_fit_rmse_full_scale_px: 20.0
    ransac_enabled: true
    ransac_min_input_points: 4
    ransac_residual_threshold_px: 20.0
    ransac_min_sample_v_gap_px: 20.0
    ransac_max_outliers: 2

  # 라인 검출 안정성
  line:
    line_stable_window: 10
    line_stable_min_hits: 7

  # 라인 보행 방향 판단과 유실 복구
  line_p2p:
    left_repetitions: 1 # Single-block timing fixture; production is covered separately.
    straight_repetitions: 1
    right_repetitions: 1
    offset_gain: 0.3
    heading_gain: 0.3
    steering_deadband: 0.10
    in_place_turn_score: 10.0 # |라인 점수|가 이 값보다 크면 WALK 제자리 회전 1회 후 재관측
    ready_lead_sec: 0.25
    failure_observation_sec: 2.0
    recovery_observation_sec: 1.0
    failure_min_valid_samples: 5
    no_evidence_max_retries: 5
    recovery_max_turns: 5
    recovery_turn_yaw_deg: 15

  ball:
    # 단독 시험 순서
    test_mission_index: 1

    down_search_max_steps: 10
    down_search_inter_action_hold_sec: 0.0
    recovery_observation_sec: 1.0
    recovery_max_observations: 5
    recovery_walk_turn_max: 3
    entry_recovery_walk_turn_max: 10
    post_pickup_back_steps: 0
    stable_window: 10
    stable_min_hits: 7
    down_search_min_hits: 7 # DOWN 1걸음 탐색 종료 검출 횟수 (최근 stable_window 프레임, FINE과 별도)
    entry_min_hits: 7 # Frozen historical scenarios; production YAML uses 6.
    lost_frames: 5
    smooth_alpha: 0.45

    upper_acquire_v_px: 470.0

    far_u_des_px: 360.0
    approach_u_deadband_px: 110
    approach_left_top_u_px: 250.0 # Vertical legacy fixture: 360-110.
    approach_right_top_u_px: 470.0 # Vertical legacy fixture: 360+110.

    approach_short_v_px: 100.0
    approach_two_step_v_px: 240.0
    approach_direct_down_v_px: 480.0 # Preserve historical two-step scenarios; focused tests set the new boundary.

    down_one_step_v_px: 0.0
    fine_side_two_step_margin_px: 100.0 # 픽업 좌우 경계 밖 초과 거리(px): 이 값 이상이면 옆걸음 2회 연속
    fine_motion:
      max_repetitions: 3
      forward_delta_u_px: 0.0
      forward_delta_v_px: 0.0
      backward_delta_u_px: 0.0
      backward_delta_v_px: 0.0
      left_delta_u_px: 0.0
      left_delta_v_px: 0.0
      right_delta_u_px: 0.0
      right_delta_v_px: 0.0
    fine_mode_v_px: 10

    pickup_u1_px: 310
    pickup_u2_px: 385
    pickup_v1_px: 80
    pickup_v2_px: 130

    pickup_max_attempts: 100
    ball_ignore_duration_sec: 5.0

    recovery_timeout_sec: 5.0
    recovery_reacquire_min_hits: 3
    recovery_center_tolerance_px: 76.8

  hurdle:
    down_search_max_steps: 10
    down_search_inter_action_hold_sec: 0.0
    recovery_observation_sec: 1.0
    recovery_max_observations: 5
    stable_window: 10
    stable_min_hits: 7
    down_search_min_hits: 7 # DOWN 1걸음 탐색 종료 검출 횟수 (최근 stable_window 프레임, FINE과 별도)
    lost_frames: 5
    smooth_alpha: 0.45

    upper_acquire_v_px: 470.0

    approach_short_v_px: 250.0
    approach_two_step_v_px: 330.0

    target_u_px: 380
    u_deadband_px: 160

    down_one_step_v_px: 100.0
    fine_mode_v_px: 180

    contact_v_px: 260
    contact_steps: 3
    contact_inter_action_hold_sec: 0.5

    hurdle_ignore_duration_sec: 5.0
    recovery_reacquire_min_hits: 3
    recovery_timeout_sec: 5.0
    recovery_center_tolerance_px: 76.8

  goal:
    # 화면 이탈 방지: 좌우 끝에서 이 픽셀 이내에 박스가 닿으면 연속 2회 회전
    edge_margin_px: 50.0 # rqt: goal_edge_margin_px, 양쪽에 동시에 닿으면 HOLD

    # 백보드 Depth 표본 및 유효 거리 (px, m)
    backboard_depth_strip_width_px: 5
    backboard_min_depth_m: 0.20
    backboard_max_depth_m: 2.50

    # 단독 시험 시작 위치와 순서
    trial_start_goal: false
    test_mission_index: 1

    recovery_turn_max: 3
    recovery_observation_sec: 1.0
    recovery_max_observations: 5
    stable_window: 10
    stable_min_hits: 7
    lost_frames: 5
    smooth_alpha: 0.45

    post_pickup_walk_fallback_actions: 3

    target_u_px: 360.0
    approach_u_deadband_px: 160

    approach_short_z_m: 1.20
    fine_adjust_start_z_m: 0.80

    camera_goal_start_z_m: 0.80

    fine_two_step_range_error_m: 0.30
    fine_one_step_range_error_m: 0.15

    hoop_radius_m: 0.10
    throw_landing_x_m: -0.08
    throw_landing_z_m: 0.40
    position_tolerance_m: 0.08
    shoot_yaw_limit_deg: 30.0

    post_shoot_back_steps: 0

    recovery_timeout_sec: 5.0
    recovery_reacquire_min_hits: 3
    recovery_center_tolerance_px: 76.8

  line_detection:
    class_id: 0
    confidence: 0.60
    min_box_width: 1.0
    min_box_height: 1.0

  object_targets:
    ball_class_id: 1
    goal_class_id: 2
    backboard_class_id: 3
    hurdle_class_id: 4
    ball_confidence: 0.60
    goal_confidence: 0.60
    backboard_confidence: 0.60
    hurdle_confidence: 0.60

    # 객체별 최소 bbox 크기(px). 이보다 작은 가로 또는 세로는 검출 후보에서 제외.
    ball_min_box_width: 2.0 # ball 최소 가로
    ball_min_box_height: 2.0 # ball 최소 세로
    goal_min_box_width: 2.0 # goal 최소 가로
    goal_min_box_height: 2.0 # goal 최소 세로
    backboard_min_box_width: 2.0 # backboard 최소 가로
    backboard_min_box_height: 2.0 # backboard 최소 세로
    hurdle_min_box_width: 2.0 # hurdle 최소 가로
    hurdle_min_box_height: 2.0 # hurdle 최소 세로

    ball_aspect_ratio_min: 0.65
    ball_aspect_ratio_max: 1.50
    hurdle_aspect_ratio_min: 2.50
    ball_depth_enabled: true
    hurdle_depth_enabled: true
    ball_allow_missing_depth: true
    hurdle_allow_missing_depth: true
    ball_forward_min_depth_m: 0.0
    ball_forward_max_depth_m: 2.50
    ball_down_min_depth_m: 0.0
    ball_down_max_depth_m: 2.50
    hurdle_min_depth_m: 0.30
    hurdle_max_depth_m: 2.00
    depth_roi_size_px: 5

  ball_candidate_tracking:
    enabled: true
    max_center_distance_px: 80.0
    max_size_log_ratio: 0.50
    missing_frame_limit: 5
    max_tracks: 16

  object_association:
    missing_frame_limit: 5
    max_center_distance_norm: 0.25
    max_size_log_ratio: 0.80
    center_distance_weight: 1.0
    size_change_weight: 0.25

  command:
    first_action_id: 1
    action_ack_timeout_sec: 10.0

  # 여러 미션에 공통으로 적용되는 설정
  mission:
    candidate_search_max_turns: 2
    candidate_direction_max_age_sec: 5.0 # Validated once after the initial stationary window.
    test_mission: 0
    test_stage: 0

    # 미션 전후 라인 복구
    mission_recovery_max_turns: 10
    mission_recovery_yaw_deg: 15

    # 카메라 전환 완료 제한
    camera_motion_timeout_sec: 3.0

    transition_settle_sec: 0.6
    walk_inter_action_hold_sec: 0.0
    fine_motion_settle_sec: 0.0
    post_motion_observation_sec: 1.0

    object_ready_mean_actions: [22, 23]

    # 사용할 미션과 시작 상태
    enable_ball: true
    enable_hurdle: true
    enable_goal: true
    initial_has_ball: false
