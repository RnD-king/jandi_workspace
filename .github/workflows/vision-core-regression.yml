name: Vision core regression
on:
  push:
    branches: [main]
    paths:
      - 'src/vision_core/**'
      - 'src/vision/**'
      - 'src/forward_walk/**'
      - '.github/workflows/vision-core-regression.yml'
  pull_request:
    paths:
      - 'src/vision_core/**'
      - 'src/vision/**'
      - 'src/forward_walk/**'
      - '.github/workflows/vision-core-regression.yml'
  workflow_dispatch:
jobs:
  shared-vision-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libyaml-cpp-dev libopencv-dev pkg-config
      - name: Configure standalone vision_core
        run: cmake -S src/vision_core -B build/shared_vision_core -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build vision_core and tests
        run: cmake --build build/shared_vision_core --parallel 2
      - name: Run shared vision core regressions
        run: ctest --test-dir build/shared_vision_core --output-on-failure
      - name: Validate production YAML and selected GOAL/LINE values
        run: build/shared_vision_core/shared_vision_core_runtime_config_check src/vision_core/config/vision_algorithm.yaml
      - name: Build and test backboard band diagnostics without ROS
        run: |
          g++ -std=c++17 -I src/vision/include src/vision/tests/backboard_depth_regions_test.cpp $(pkg-config --cflags --libs opencv4) -o /tmp/vision_backboard_depth_regions_test
          /tmp/vision_backboard_depth_regions_test
      - name: Build and test vision mission debug renderer without ROS
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I src/vision/include -I src/vision_core/include \
            src/vision/tests/mission_debug_view_test.cpp \
            -L "$PWD/build/shared_vision_core" -lshared_vision_core \
            $(pkg-config --cflags --libs opencv4) \
            -Wl,-rpath,"$PWD/build/shared_vision_core" \
            -o /tmp/vision_mission_debug_view_test
          /tmp/vision_mission_debug_view_test
      - name: Test SSH terminal renderer
        run: python3 src/vision/tests/terminal_view_test.py
      - name: Test mock executor protocol
        run: python3 src/vision/tests/mock_executor_protocol_test.py
      - name: Test LINE 36 READY and camera scan
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I src/forward_walk/include src/forward_walk/tests/scan_motion_test.cpp -o /tmp/jandi_scan_motion_test
          /tmp/jandi_scan_motion_test
      - name: Test forward_walk source contracts
        run: python3 src/forward_walk/tests/source_contract_test.py
